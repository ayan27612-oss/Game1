<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PROTOCOL: WARFORGE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2=".65" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset=".55" stop-color="#0b1019"/>
      <stop offset="1" stop-color="#24100a"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".46" r=".62">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".32"/>
      <stop offset=".42" stop-color="#b5121b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#04060b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ff6a4d"/>
      <stop offset=".42" stop-color="#d21f26"/>
      <stop offset="1" stop-color="#6d0a10"/>
    </linearGradient>
    <linearGradient id="gold" x1=".2" y1="0" x2=".8" y2="1">
