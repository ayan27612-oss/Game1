<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="PROTOCOL: SWARM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150826"/>
      <stop offset=".5" stop-color="#06010f"/>
      <stop offset="1" stop-color="#1c0629"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".42" r=".6">
      <stop offset="0" stop-color="#ff2f8e" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#8b5cff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#04010a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset=".5" stop-color="#ff2f8e"/>
      <stop offset="1" stop-color="#b06bff"/>
    </linearGradient>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <g stroke="#46f4ff" stroke-opacity=".08" stroke-width="1">
