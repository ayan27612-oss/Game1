    <circle cx="256" cy="256" r="116" stroke="#46f4ff" stroke-opacity=".35" stroke-width="2"/>
    <path d="M256 58v38M256 416v38M58 256h38M416 256h38" stroke="#46f4ff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g filter="url(#pinkGlow)">
    <path d="M256 148l108 108-108 108-108-108z" fill="url(#core)" opacity=".18"/>
    <path d="M256 174l82 82-82 82-82-82z" fill="none" stroke="#ff2f8e" stroke-width="7" stroke-linejoin="round"/>
    <path d="M256 210l46 46-46 46-46-46z" fill="url(#core)" stroke="#ffd7f2" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g fill="#59ffa8">
    <circle cx="256" cy="92" r="7"/>
    <circle cx="382" cy="162" r="5"/>
    <circle cx="406" cy="322" r="7"/>
    <circle cx="292" cy="414" r="5"/>
    <circle cx="132" cy="376" r="7"/>
    <circle cx="108" cy="196" r="5"/>
  </g>

